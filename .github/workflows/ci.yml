name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The test suite is offline: it never loads the model, so torch/transformers
      # are not needed in CI. Only pytest is required.
      - run: pip install pytest
      - run: pytest
